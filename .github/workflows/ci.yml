name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Type-check, test and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the domain package
        run: npm run build -w @shift-planner/core

      - name: Generate the Prisma client
        run: npx prisma generate
        working-directory: apps/api

      - name: Type-check every package
        run: npm run typecheck

      - name: Run the scheduling rule tests
        run: npm test

      - name: Build the API and web client
        run: npm run build
        env:
          DATABASE_URL: file:./ci.db
          JWT_SECRET: ci-only-secret-not-used-for-anything-real

      - name: Audit dependencies
        run: npm audit --audit-level=moderate
